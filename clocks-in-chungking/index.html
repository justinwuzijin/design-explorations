<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clocks in Chungking — WebGL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body {
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #ffffff;
    }

    /* ---- the wall ------------------------------------------------------ */
    .wall {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* plain bright-white showroom wall */
      --cast: rgba(0, 0, 0, 0);
      --frame-light: #ffffff;
      --frame-mid: #e4e1d8;
      --frame-dark: #aeaaa0;
      background: #ffffff;
    }

    /* the cluster of clocks */
    .clocks {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      align-content: center;
      gap: 22px 26px;
      width: min(1180px, 94vw);
      max-height: 100vh;
      padding: 40px 0;
      z-index: 2;
    }

    /* ---- clock unit ---------------------------------------------------- */
    .clock {
      --r: 12px;
      position: relative;
      border-radius: calc(var(--r) + 11px);
      padding: var(--pad, 15px);
      background:
        linear-gradient(152deg,
          var(--frame-light) 0%,
          var(--frame-mid, #cfccc4) 46%,
          var(--frame-dark) 100%);
      box-shadow:
        0 30px 50px rgba(0, 0, 0, 0.55),
        0 10px 18px rgba(0, 0, 0, 0.42),
        inset 0 2px 1px rgba(255, 255, 255, 0.65),
        inset 0 -4px 8px rgba(0, 0, 0, 0.38),
        inset 3px 0 6px rgba(255, 255, 255, 0.16),
        inset -3px 0 6px rgba(0, 0, 0, 0.22);
      transition: filter 0.6s ease, background 0.6s ease;
    }
    /* glossy moulded-plastic rim */
    .clock::before {
      content: '';
      position: absolute; inset: 4px;
      border-radius: calc(var(--r) + 7px);
      background: linear-gradient(150deg,
        rgba(255, 255, 255, 0.5) 0%,
        rgba(255, 255, 255, 0) 26%,
        rgba(0, 0, 0, 0) 72%,
        rgba(0, 0, 0, 0.22) 100%);
      pointer-events: none;
    }
    .clock::after {
      /* film colour cast over the glass */
      content: '';
      position: absolute; inset: 0;
      border-radius: inherit;
      background: var(--cast);
      pointer-events: none;
      mix-blend-mode: screen;
      transition: background 0.6s ease;
    }
    .clock-face {
      position: relative;
      border-radius: var(--r);
      background:
        radial-gradient(120% 140% at 50% -10%, rgba(255,255,255,0.5), rgba(255,255,255,0) 40%),
        var(--face, #f4f2ec);
      padding: var(--face-pad, 12px);
      display: flex;
      flex-direction: column;
      gap: var(--face-gap, 9px);
      box-shadow:
        inset 0 3px 10px rgba(0, 0, 0, 0.3),
        inset 0 0 0 1px rgba(0, 0, 0, 0.07),
        inset 0 -2px 4px rgba(255, 255, 255, 0.4);
    }
    /* glass-cover sheen */
    .clock-face::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(122deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.06) 20%,
        rgba(255, 255, 255, 0) 42%);
      mix-blend-mode: screen;
      z-index: 8;
    }
    .clock-row {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: var(--gap, 7px);
    }
    .brand {
      position: absolute;
      right: 10px;
      bottom: 6px;
      font-size: 8px;
      letter-spacing: 0.12em;
      font-weight: 600;
      color: rgba(0,0,0,0.32);
      pointer-events: none;
    }
    .clock-label {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: rgba(0,0,0,0.5);
      text-transform: uppercase;
    }

    /* ---- a flip tile (digit or word) ----------------------------------- */
    .flap {
      --w: 54px;
      --h: 80px;
      --fs: 62px;
      --fs-cn: 15px;
      --card: #1d1f24;
      --ink: #f6f5f1;
      --tr: 5px;
      --dur: 330ms;
      position: relative;
      width: var(--w);
      height: var(--h);
      perspective: 460px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 700;
      flex: 0 0 auto;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.5));
    }
    .flap-half, .flap-leaf {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      background: var(--card);
      color: var(--ink);
    }
    /* moulded cards: light catches the top half, the bottom half falls into shade */
    .flap-half.top, .flap-leaf.top {
      top: 0;
      border-radius: var(--tr) var(--tr) 0 0;
      background:
        linear-gradient(180deg,
          rgba(255,255,255,0.14) 0%,
          rgba(255,255,255,0.02) 48%,
          rgba(0,0,0,0.28) 100%),
        var(--card);
    }
    .flap-half.bottom, .flap-leaf.bottom {
      bottom: 0;
      border-radius: 0 0 var(--tr) var(--tr);
      background:
        linear-gradient(180deg,
          rgba(0,0,0,0.30) 0%,
          rgba(0,0,0,0.04) 30%,
          rgba(0,0,0,0.10) 100%),
        var(--card);
    }
    .glyph {
      position: absolute;
      left: 0;
      width: 100%;
      height: var(--h);
      line-height: var(--h);
      text-align: center;
      font-size: var(--fs);
      letter-spacing: 0.01em;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
    }
    .flap-half.top .glyph, .flap-leaf.top .glyph { top: 0; }
    .flap-half.bottom .glyph, .flap-leaf.bottom .glyph { bottom: 0; }

    /* bilingual cards (day / month): English on the top flap, Chinese on the bottom */
    .flap.split .glyph {
      position: absolute;
      left: 0; right: 0;
      top: 0; bottom: auto;
      width: 100%; height: 100%;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
    }
    .flap.split .flap-half.top .glyph, .flap.split .flap-leaf.top .glyph {
      font-size: var(--fs);
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .flap.split .flap-half.bottom .glyph, .flap.split .flap-leaf.bottom .glyph {
      font-size: var(--fs-cn);
      font-weight: 600;
      letter-spacing: 0.04em;
      font-family: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    }

    /* leaves do the folding */
    .flap-leaf {
      backface-visibility: hidden;
      z-index: 3;
    }
    .flap-leaf.top    { transform-origin: 50% 100%; }
    .flap-leaf.bottom { transform-origin: 50% 0%; transform: rotateX(90deg); }

    /* shading that sweeps across the moving leaf */
    .flap-leaf::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%);
      opacity: 0;
      transition: opacity 0.1s linear;
    }
    .flap.flip .flap-leaf.top::after { opacity: 0.6; }

    .flap.flip .flap-leaf.top {
      animation: foldTop calc(var(--dur) / 2) cubic-bezier(.36,0,.66,-0.05) forwards;
    }
    .flap.flip .flap-leaf.bottom {
      animation: foldBottom calc(var(--dur) / 2) cubic-bezier(.18,.9,.32,1.1) calc(var(--dur) / 2) forwards;
    }
    @keyframes foldTop {
      0%   { transform: rotateX(0deg); }
      100% { transform: rotateX(-90deg); }
    }
    @keyframes foldBottom {
      0%   { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }

    /* the recessed centre gap where the two cards meet */
    .flap::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      height: 4px;
      transform: translateY(-2px);
      background: linear-gradient(180deg,
        rgba(0,0,0,0.6) 0%,
        rgba(0,0,0,0.8) 55%,
        rgba(255,255,255,0.07) 100%);
      z-index: 6;
      pointer-events: none;
    }
    /* the metal pivot pegs the cards spin on */
    .flap::before {
      content: '';
      position: absolute;
      top: 50%; left: -3px; right: -3px;
      height: 9px;
      transform: translateY(-4.5px);
      z-index: 7;
      pointer-events: none;
      background:
        radial-gradient(circle at left center,  #c7cace 0 3px, rgba(0,0,0,0.3) 3.4px, transparent 4.2px),
        radial-gradient(circle at right center, #c7cace 0 3px, rgba(0,0,0,0.3) 3.4px, transparent 4.2px);
    }

    .flap-sep {
      align-self: center;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 700;
      color: rgba(0,0,0,0.0);
      width: 6px;
    }

    /* ---- analog clock -------------------------------------------------- */
    .analog {
      position: relative;
      border-radius: 50%;
      background: var(--face, #f4f2ec);
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.25), inset 0 0 0 3px rgba(0,0,0,0.06);
    }
    .analog .tick {
      position: absolute; left: 50%; top: 50%;
      width: 2px; height: 50%;
      transform-origin: 50% 0;
      transform: translate(-50%, 0) rotate(var(--a));
    }
    .analog .tick i {
      display: block; width: 2px; height: 8%;
      background: rgba(0,0,0,0.5); margin: 4% auto 0;
    }
    .analog .hand {
      position: absolute; left: 50%; top: 50%;
      transform-origin: 50% 100%;
      border-radius: 4px;
      background: #15151a;
    }
    .analog .hand.hour { width: 5px; height: 26%; margin-left: -2.5px; margin-top: -26%; }
    .analog .hand.min  { width: 3.5px; height: 36%; margin-left: -1.75px; margin-top: -36%; }
    .analog .hand.sec  { width: 1.5px; height: 40%; margin-left: -0.75px; margin-top: -40%; background: #c0392b; }
    .analog .cap { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px; border-radius: 50%; background: #15151a; }
    .analog .num {
      position: absolute; left: 50%; top: 50%;
      font-size: 11px; font-weight: 600; color: rgba(0,0,0,0.55);
      transform: translate(-50%, -50%);
      font-family: 'Inter', sans-serif;
    }

    /* ---- chrome -------------------------------------------------------- */
    #back {
      position: fixed; top: 22px; left: 24px;
      color: rgba(0, 0, 0, 0.45);
      font-size: 0.73rem; text-decoration: none; letter-spacing: 0.04em;
      transition: color 0.18s; z-index: 20;
    }
    #back:hover { color: rgba(0, 0, 0, 0.85); }

    #panel {
      position: fixed; right: 22px; bottom: 22px; z-index: 20;
      background: rgba(20, 24, 28, 0.55);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 14px 16px 13px;
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.4);
      color: rgba(255,255,255,0.85);
      user-select: none;
      min-width: 188px;
    }
    .panel-title {
      font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.45); margin-bottom: 12px;
    }
    .panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .panel-row:last-child { margin-bottom: 0; }
    .panel-label { font-size: 0.68rem; color: rgba(255,255,255,0.55); letter-spacing: 0.02em; }
    .seg { display: flex; gap: 4px; }
    .seg button, .pill {
      border: none; cursor: pointer;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.6);
      font-size: 0.66rem; font-family: inherit;
      padding: 5px 9px; border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }
    .seg button:hover, .pill:hover { background: rgba(255,255,255,0.16); color: #fff; }
    .seg button.active { background: rgba(120, 210, 230, 0.85); color: #08121a; font-weight: 600; }
    .pill { width: 100%; text-align: center; letter-spacing: 0.06em; }

    @media (max-width: 720px) {
      .clocks { gap: 16px; }
      #panel { right: 14px; bottom: 14px; min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="wall" id="wall">
    <div class="clocks" id="clocks"></div>
  </div>

  <a href="../" id="back">← back</a>

  <div id="panel">
    <div class="panel-title">clocks in chungking</div>
    <div class="panel-row">
      <span class="panel-label">speed</span>
      <div class="seg" id="speed-seg">
        <button data-speed="1" class="active">1×</button>
        <button data-speed="60">60×</button>
        <button data-speed="300">300×</button>
      </div>
    </div>
    <div class="panel-row">
      <button class="pill" id="now-btn">now</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
