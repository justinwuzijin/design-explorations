<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grass Wind — WebGL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { background: #0e1a08; overflow: hidden; }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #back {
      position: fixed;
      top: 22px;
      left: 24px;
      color: rgba(180, 210, 140, 0.45);
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.18s;
      z-index: 10;
    }
    #back:hover { color: rgba(180, 210, 140, 0.9); }

    #controls {
      position: fixed;
      bottom: 24px;
      left: 24px;
      padding: 0;
      color: rgba(195, 230, 150, 0.9);
      font-family: 'Inter', sans-serif;
      font-size: 0.73rem;
      min-width: 230px;
      user-select: none;
      z-index: 10;
    }

    #controls h2 {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgba(130, 170, 80, 0.6);
      text-transform: none;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
    }
    .row:last-child { margin-bottom: 0; }

    .row label {
      flex: 0 0 138px;
      color: rgba(175, 215, 120, 0.75);
      font-size: 0.71rem;
    }

    .row input[type=range] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(to right,
        rgba(140, 200, 80, 0.65) var(--pct, 50%),
        rgba(255, 255, 255, 0.13) var(--pct, 50%)
      );
      cursor: pointer;
      outline: none;
    }
    .row input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(195, 230, 150, 0.95);
      border: 2.5px solid rgba(14, 26, 8, 0.9);
      cursor: pointer;
      margin-top: -6.5px;
    }
    .row input[type=range]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 2px;
    }

    .row span {
      flex: 0 0 36px;
      text-align: right;
      font-size: 0.69rem;
      color: rgba(195, 230, 150, 0.9);
      font-variant-numeric: tabular-nums;
    }

    #hint {
      position: fixed;
      bottom: 24px;
      right: 24px;
      color: rgba(140, 180, 90, 0.32);
      font-family: 'Inter', sans-serif;
      font-size: 0.67rem;
      letter-spacing: 0.04em;
      line-height: 1.6;
      text-align: right;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <a href="../" id="back">← back</a>

  <div id="controls">
    <h2>wind &amp; interaction</h2>

    <div class="row">
      <label>wind intensity</label>
      <input type="range" id="windIntensity" min="0" max="2" step="0.01" value="0.7" />
      <span id="windIntensity-val">0.7</span>
    </div>

    <div class="row">
      <label>wind direction °</label>
      <input type="range" id="windAngle" min="0" max="360" step="1" value="45" />
      <span id="windAngle-val">45</span>
    </div>

    <div class="row">
      <label>cursor sensitivity</label>
      <input type="range" id="cursorSensitivity" min="0" max="1" step="0.01" value="0.5" />
      <span id="cursorSensitivity-val">0.5</span>
    </div>

    <div class="row">
      <label>influence radius</label>
      <input type="range" id="influenceRadius" min="0.02" max="0.5" step="0.01" value="0.18" />
      <span id="influenceRadius-val">0.18</span>
    </div>
  </div>

  <div id="hint">
    move cursor to disturb<br>
    fluid velocity field
  </div>

  <script>
    function updateSliderFill(el) {
      const pct = (el.value - el.min) / (el.max - el.min) * 100;
      el.style.setProperty('--pct', pct + '%');
    }
    document.querySelectorAll('input[type=range]').forEach(el => {
      updateSliderFill(el);
      el.addEventListener('input', () => updateSliderFill(el));
    });
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
