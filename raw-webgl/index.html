<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raw WebGL — Bokeh</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f3ee;
      font-family: 'Georgia', serif;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 40px 20px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1rem;
      font-weight: normal;
      letter-spacing: 0.03em;
    }

    header p {
      font-size: 0.75rem;
      color: #888;
      margin-top: 2px;
    }

    .canvas-wrap {
      position: relative;
      width: min(720px, 100%);
      aspect-ratio: 16 / 9;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 24px rgba(0,0,0,0.12);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #time {
      font-style: italic;
      font-size: 0.85rem;
      color: #555;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px 24px;
      width: min(720px, 100%);
      background: white;
      border-radius: 6px;
      padding: 16px 20px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.07);
    }

    .control {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
      display: flex;
      justify-content: space-between;
    }

    .control label span {
      color: #333;
      font-variant-numeric: tabular-nums;
    }

    input[type=range] {
      width: 100%;
      accent-color: #555;
    }

    .badge {
      font-size: 0.65rem;
      background: #eee;
      color: #888;
      padding: 2px 8px;
      border-radius: 99px;
      align-self: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>San Francisco <span class="badge">Raw WebGL</span></h1>
    <p>Apr. 2026</p>
  </header>

  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <p id="time"></p>

  <div class="controls">
    <div class="control">
      <label>Blur Radius <span id="radius-value">18</span></label>
      <input type="range" id="radius" min="0" max="60" step="0.5" />
    </div>
    <div class="control">
      <label>Bloom Threshold <span id="bloomThreshold-value">0.6</span></label>
      <input type="range" id="bloomThreshold" min="0" max="1" step="0.01" />
    </div>
    <div class="control">
      <label>Bloom Strength <span id="bloomStrength-value">8</span></label>
      <input type="range" id="bloomStrength" min="0" max="20" step="0.5" />
    </div>
    <div class="control">
      <label>Vignette <span id="vignette-value">1</span></label>
      <input type="range" id="vignette" min="0" max="2" step="0.05" />
    </div>
    <div class="control">
      <label>Samples <span id="samples-value">64</span></label>
      <input type="range" id="samples" min="8" max="128" step="4" />
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
