<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Justin's Design Experiments</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#f2ede6',
            'cream-dark': '#e8e1d8',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;1,14..32,300&display=swap" rel="stylesheet" />
  <style>
    body { background: #f2ede6; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body class="font-sans overflow-hidden">

  <canvas id="canvas"></canvas>

  <!-- Nav -->
  <nav class="fixed top-0 left-0 right-0 z-10 flex items-center justify-between px-8 py-6 pointer-events-none">
    <span class="text-xs tracking-[0.2em] text-stone-400 uppercase">JW</span>
    <div class="flex gap-6 text-xs tracking-widest text-stone-400 uppercase">
      <a href="../" class="pointer-events-auto hover:text-stone-600 transition-colors">Index</a>
      <a href="../raw-webgl/" class="pointer-events-auto hover:text-stone-600 transition-colors">WebGL</a>
      <a href="../threejs-cube/" class="pointer-events-auto hover:text-stone-600 transition-colors">Cube</a>
    </div>
  </nav>

  <!-- Center text -->
  <div class="fixed inset-0 z-10 flex flex-col items-center justify-center pointer-events-none select-none">
    <p class="text-[10px] tracking-[0.3em] text-stone-400 uppercase mb-5">
      A collection of moving images
    </p>
    <h1 class="text-center leading-[1.1] text-stone-700">
      <span class="block text-5xl font-light tracking-tight">Justin's Design</span>
      <span class="block text-5xl font-light tracking-tight italic text-stone-400">Experiments</span>
    </h1>
    <p class="mt-6 text-xs text-stone-400 tracking-[0.15em] text-center max-w-xs leading-relaxed">
      Shot on 16mm &nbsp;·&nbsp; Somewhere between<br/>a feeling and a frame
    </p>
    <div class="mt-8 flex gap-6 text-[10px] tracking-[0.25em] uppercase text-stone-400">
      <a href="#" class="pointer-events-auto border-b border-stone-300 pb-px hover:text-stone-600 hover:border-stone-500 transition-colors">Explore</a>
      <a href="#" class="pointer-events-auto border-b border-stone-300 pb-px hover:text-stone-600 hover:border-stone-500 transition-colors">Archive</a>
    </div>
  </div>

  <!-- Bottom bar -->
  <footer class="fixed bottom-0 left-0 right-0 z-10 flex items-end justify-between px-8 py-5 pointer-events-none">
    <p class="text-[9px] tracking-widest text-stone-300 uppercase">Indie film &amp; motion</p>
    <p class="text-[9px] tracking-widest text-stone-300 uppercase">2026</p>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
